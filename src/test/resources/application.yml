spring:
  application:
    name: i-itsm-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  mail:
    host: localhost
    port: 3025
    properties:
      mail:
        smtp:
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000

  flyway:
    enabled: true
    locations: classpath:db/migration

iitsm:
  classification:
    min-confidence: 0.60
  security:
    jwt:
      secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      expiration-ms: 3600000
    max-failed-logins: 5
  simulation:
    seed: 42
    auto-seed: false

