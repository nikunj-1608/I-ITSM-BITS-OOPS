server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false

spring:
  application:
    name: i-itsm
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:iitsmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration

iitsm:
  mail:
    from: ${MAIL_FROM:no-reply@nimbusfinserve.com}
    override-recipient: ${REAL_EMAIL_OVERRIDE:}
  classification:
    min-confidence: ${MIN_CONFIDENCE:0.60}
  demo-mode: ${DEMO_MODE:true}
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-and-demo-fallback-secret-key-at-least-32-bytes!}
      expiration-ms: ${JWT_EXPIRATION_MS:7200000} # 120 minutes for uninterrupted evaluations and live demo recordings
    max-failed-logins: 5
  simulation:
    seed: 42
    auto-seed: true

---
spring:
  config:
    activate:
      on-profile: dev

iitsm:
  demo-mode: true
  security:
    jwt:
      expiration-ms: ${JWT_EXPIRATION_MS:7200000} # 120 minutes for dev exploration

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iitsm_prod}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

iitsm:
  demo-mode: false
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
  simulation:
    auto-seed: false

---
spring:
  config:
    activate:
      on-profile: demo

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:iitsm_prod}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

iitsm:
  demo-mode: true
  security:
    jwt:
      secret: ${JWT_SECRET:nimbus-finserve-iitsm-demo-super-secret-key-2026-production-grade}
      expiration-ms: ${JWT_EXPIRATION_MS:7200000} # 120 minutes
  simulation:
    auto-seed: true
