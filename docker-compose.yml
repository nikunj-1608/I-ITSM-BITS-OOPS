version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iitsm-app
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iitsm_prod
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-nimbus-finserve-jwt-secret-must-be-provided-in-env-file-at-least-32-bytes}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: iitsm-postgres
    restart: always
    environment:
      POSTGRES_DB: iitsm_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iitsm_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: iitsm-mailpit
    restart: always
    ports:
      - "1025:1025" # Mock SMTP
      - "8025:8025" # Web Mail UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
